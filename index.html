<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AZILE — Elizaをモチーフにした、そこそこ文法解析をしてそこそこ会話できる日本語チャット。">
  <meta name="theme-color" content="#0b0f0c">
  <title>AZILE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0f0c'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='monospace' fill='%2359ff9c'%3E%3E_%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="crt" aria-hidden="true"></div>

  <main class="terminal" id="terminal">
    <header class="term-header">
      <div class="term-title">
        <span class="term-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="term-name">AZILE</span>
        <span class="term-ver">v1.0</span>
      </div>
      <div class="term-status">
        <span class="status-pill" id="engine-status" title="形態素解析エンジン">ENGINE: <b>TINY</b></span>
        <span class="status-pill" id="net-status" title="ネットワーク">NET: <b>—</b></span>
        <span class="status-clock" id="clock" aria-live="off">--:--:--</span>
      </div>
    </header>

    <div class="term-body">
      <div class="term-main">
        <section class="term-output" id="output" aria-live="polite" aria-label="会話ログ"></section>

        <form class="term-prompt" id="prompt-form" autocomplete="off">
          <label class="prompt-label" for="prompt-input">you&gt;</label>
          <input class="prompt-input" id="prompt-input" type="text" inputmode="text"
                 placeholder="なにか話しかけてみて（/help でコマンド一覧）" maxlength="400" autofocus>
          <button class="prompt-send" type="submit" aria-label="送信">⏎</button>
        </form>
      </div>

      <aside class="term-side" aria-label="AZILE の立ち絵">
        <div class="sprite-frame">
          <img class="sprite" id="sprite" src="image/web/azile_nomal.png" alt="AZILE" data-emo="nomal" decoding="async">
        </div>
        <div class="sprite-label" id="sprite-label">STATUS: NORMAL</div>
      </aside>
    </div>
  </main>

  <!-- 形態素解析: TinySegmenter（即時） + kuromoji.js（Web Worker 内で辞書ロード後に切替） -->
  <script src="js/lib/tiny_segmenter.js"></script>

  <!-- アプリ本体 -->
  <script src="js/data/persona.js"></script>
  <script src="js/data/rules.js"></script>
  <script src="js/data/replies.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/mood.js"></script>
  <script src="js/analyzer.js"></script>
  <script src="js/api.js"></script>
  <script src="js/brain.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
